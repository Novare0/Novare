<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novare | Contacto</title>
    <meta name="description" content="Ponte en contacto con Novare.">
    <link rel="stylesheet" href="CSS/style.css?v=20261116-neo2">
</head>
<body>
    <header class="site-header"><nav class="nav-bar"><a href="index.html" class="brand">NOVARE<span>®</span></a><button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button><ul class="nav-links"><li><a href="index.html">Inicio</a></li><li><a href="servicios.html">Servicios</a></li><li><a href="productos.html">Productos</a></li><li><a href="album.html">Álbum</a></li><li><a href="contacto.html">Contacto</a></li></ul></nav></header>

    <main>
        <section class="section contact">
            <div class="section-heading">
                <p class="eyebrow">Contacto</p>
                <h1>Hablemos de tu próximo proyecto.</h1>
            </div>
            <div class="contact-grid">
                <form class="contact-form">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Tu nombre">

                    <label for="email">Correo</label>
                    <input type="email" id="email" placeholder="tu@email.com">

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="5" placeholder="Cuéntanos qué necesitas..."></textarea>

                    <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                </form>
                <div class="contact-info">
                    <h3>Escríbenos</h3>
                    <p>Estamos listos para crear contenido que impulse tu marca.</p>
                    <ul>
                        <li>📧 novareestudio@gmail.com</li>
                        <li>📍 El Salvador</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Novare. Todos los derechos reservados.</p>
    </footer>

    <script src="JS/main.js"></script>
</body>
</html>
