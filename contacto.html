<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novare | Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Ponte en contacto con Novare.">
    <link rel="stylesheet" href="CSS/style.css?v=20261116-typepass">
</head>
<body>
    <header class="site-header">
  <nav class="nav-bar" aria-label="Navegación principal">
    <a href="index.html" class="brand" aria-label="Novare, inicio">NOVARE<span>®</span></a>
    <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="primary-navigation">☰</button>
    <button class="theme-toggle" type="button" aria-label="Cambiar a tema claro" aria-pressed="true" title="Cambiar tema">☼</button>
    <ul class="nav-links" id="primary-navigation">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="album.html">Álbum</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>
</header>

    <main>
        <section class="section contact">
            <div class="section-heading">
                <p class="eyebrow">Contacto</p>
                <h1>Hablemos de tu próximo proyecto.</h1>
            </div>
            <div class="contact-grid">
                <form class="contact-form" id="novareContactForm" action="https://formsubmit.co/novareestudio@gmail.com" method="POST">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="name" placeholder="Tu nombre" autocomplete="name" maxlength="100" required>

                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" maxlength="254" required>

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="message" rows="5" placeholder="Cuéntanos qué necesitas..." maxlength="5000" required></textarea>

                    <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" class="form-honeypot">
                    <input type="hidden" name="_subject" value="Nueva solicitud desde la web de Novare">
                    <input type="hidden" name="_replyto" id="contactReplyTo">
                    <button type="submit" class="btn btn-primary" id="contactSubmit">Enviar mensaje</button>
                    <p class="contact-form-status" id="contactFormStatus" role="status" aria-live="polite"></p>
                </form>
                <div class="contact-info">
                    <h3>Escríbenos</h3>
                    <p>Estamos listos para crear contenido que impulse tu marca.</p>
                    <ul>
                        <li>📧 novareestudio@gmail.com</li>
                        <li>📍 El Salvador</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Novare. Todos los derechos reservados.</p>
    </footer>

    <script src="JS/main.js?v=20261116-formpost1"></script>
</body>
</html>
